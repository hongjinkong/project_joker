# 담당: 원서윤 (데이터 총괄·취합·최종 O/X 판정) — 한자 혼용 · 한국 문서서식(기안문·품의서) (목표 6개, 아래 2개는 AI가 채운 견본 — 그대로 두지 말고 본인 문구로 교체/추가할 것)
